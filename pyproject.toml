[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shutterstorm"
version = "0.1.0"
description = "AI-driven chaos engineering, proven on Immich"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "docker>=7",
    "httpx>=0.27",
    "pydantic>=2",
    "networkx>=3",
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6",
    "jinja2>=3",
    "pillow>=10",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
shutterstorm = "shutterstorm.cli:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
